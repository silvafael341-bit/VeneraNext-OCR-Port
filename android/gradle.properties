# Stable Gradle settings for Codespaces / 8 GB RAM builders
# Keep the heap below the container limit so the Gradle daemon does not disappear.
org.gradle.jvmargs=-Xms512m -Xmx2G -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.caching=true
kotlin.incremental=false
android.useAndroidX=true
android.enableJetifier=true
android.defaults.buildfeatures.buildconfig=true
android.nonTransitiveRClass=false
android.nonFinalResIds=false
