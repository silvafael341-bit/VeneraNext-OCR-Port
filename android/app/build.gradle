plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

ext.abiCodes = ["armeabi-v7a": 1, "arm64-v8a": 2, "x86_64": 3]

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader -> localProperties.load(reader) }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode") ?: "1"
def flutterVersionName = localProperties.getProperty("flutter.versionName") ?: "1.0"

def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
def hasKeystoreProperties = keystorePropertiesFile.exists()
if (hasKeystoreProperties) keystoreProperties.load(new FileInputStream(keystorePropertiesFile))

def configureSigning = { signingConfig ->
    if (hasKeystoreProperties) {
        signingConfig.storeFile = file(keystoreProperties['storeFile'])
        signingConfig.storePassword = keystoreProperties['storePassword']
        signingConfig.keyAlias = keystoreProperties['keyAlias']
        signingConfig.keyPassword = keystoreProperties['keyPassword']
    }
}

android {
    namespace = "com.github.kiastr.venera_ssr"
    compileSdk = flutter.compileSdkVersion
    ndkVersion "28.0.13004108"

    packaging { jniLibs { useLegacyPackaging true } }

    sourceSets {
        main {
            // SSR Kotlin sources are embedded into the main application.
            java.srcDirs += [
                "${rootProject.projectDir}/../vendor/venera-ssr/android/app/src/main/kotlin"
            ]
            // Do NOT import SSR res/: VeneraNext already owns the launcher/theme
            // resources and importing both trees creates duplicate Android resources.
            assets.srcDirs += [
                "${rootProject.projectDir}/../vendor/venera-ssr/android/app/src/main/assets"
            ]
        }
    }

    splits {
        abi {
            reset()
            include 'armeabi-v7a', 'arm64-v8a', 'x86_64'
            enable true
            universalApk true
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = JavaVersion.VERSION_17 }

    signingConfigs {
        debug { configureSigning(delegate) }
        release { configureSigning(delegate) }
    }

    defaultConfig {
        applicationId = "com.github.cyrilpeng.veneranext"
        minSdk = 24
        targetSdk = flutter.targetSdkVersion
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            ndk { abiFilters "armeabi-v7a", "arm64-v8a", "x86_64" }
            if (hasKeystoreProperties) signingConfig signingConfigs.release
        }
        debug {
            ndk { abiFilters "armeabi-v7a", "arm64-v8a", "x86_64" }
            if (hasKeystoreProperties) signingConfig signingConfigs.debug
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def abi = output.getFilter(com.android.build.OutputFile.ABI)
            if (variant.buildType.name == "release") {
                if (abi != null) {
                    outputFileName = "VeneraNext-${variant.versionName}-android-${abi}.apk"
                    def abiVersionCode = project.ext.abiCodes.get(abi)
                    if (abiVersionCode != null) versionCodeOverride = variant.versionCode * 10 + abiVersionCode
                } else {
                    outputFileName = "VeneraNext-${variant.versionName}-android.apk"
                    versionCodeOverride = variant.versionCode * 10
                }
            } else if (variant.buildType.name == "debug") {
                versionCodeOverride = variant.versionCode * 10 + 4
            }
        }
    }

    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }
}

flutter { source = "../.." }

dependencies {
    implementation "androidx.activity:activity-ktx:1.10.1"
    implementation "androidx.documentfile:documentfile:1.0.1"
    implementation "com.google.mlkit:text-recognition:16.0.1"
    implementation "com.google.mlkit:text-recognition-chinese:16.0.1"
    implementation "com.google.mlkit:text-recognition-japanese:16.0.1"
    implementation "com.google.mlkit:text-recognition-korean:16.0.1"
    implementation "org.opencv:opencv:4.11.0"
    implementation "com.microsoft.onnxruntime:onnxruntime-android:1.23.0"
    implementation "org.tensorflow:tensorflow-lite:2.17.0"
    implementation "io.github.awxkee:avif-coder:2.2.1"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.recyclerview:recyclerview:1.3.2"
    implementation "androidx.core:core-ktx:1.13.1"
}
