name: Build VeneraNext APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Flutter 3.29.3
        shell: bash
        run: |
          set -euo pipefail
          FLUTTER_DIR="$RUNNER_TEMP/flutter"
          git clone --depth 1 --branch 3.29.3 https://github.com/flutter/flutter.git "$FLUTTER_DIR"
          echo "$FLUTTER_DIR/bin" >> "$GITHUB_PATH"
          echo "PUB_CACHE=$RUNNER_TEMP/pub-cache" >> "$GITHUB_ENV"
          "$FLUTTER_DIR/bin/flutter" --version
          "$FLUTTER_DIR/bin/flutter" precache --android

      - name: Extract project archive
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/venera-project
          mkdir -p /tmp/venera-project
          unzip -q VeneraNext-OCR-Port-atual.zip -d /tmp/venera-project
          PROJECT_DIR="$(find /tmp/venera-project -type f -name pubspec.yaml -print -quit | xargs -r dirname)"
          if [ -z "${PROJECT_DIR}" ] || [ ! -f "${PROJECT_DIR}/pubspec.yaml" ]; then
            echo 'ERROR: pubspec.yaml not found inside VeneraNext-OCR-Port-atual.zip'
            find /tmp/venera-project -maxdepth 4 -type f | head -100
            exit 1
          fi
          echo "PROJECT_DIR=${PROJECT_DIR}" >> "$GITHUB_ENV"
          echo "Flutter project: ${PROJECT_DIR}"

      - name: Verify toolchain
        run: |
          java -version
          flutter --version
          flutter doctor -v

      - name: Get dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
        run: flutter build apk --debug

      - name: Locate APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "${PROJECT_DIR}/build/app/outputs/apk" -type f -name '*.apk' -print -quit)"
          if [ -z "${APK}" ]; then
            echo 'ERROR: APK was not generated.'
            find "${PROJECT_DIR}/build" -type f | tail -100 || true
            exit 1
          fi
          mkdir -p /tmp/apk-output
          cp "${APK}" /tmp/apk-output/VeneraNext-OCR-debug.apk
          ls -lh /tmp/apk-output/VeneraNext-OCR-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: VeneraNext-OCR-debug
          path: /tmp/apk-output/VeneraNext-OCR-debug.apk
          if-no-files-found: error
