name: Trigger Android build

on:
  push:
    branches:
      - rebuild-venera-ocr-integrated

permissions:
  actions: write
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-22.04
    steps:
      - name: Dispatch Android OCR build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run android-ocr-build.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref rebuild-venera-ocr-integrated
          echo "Android OCR build dispatched."
