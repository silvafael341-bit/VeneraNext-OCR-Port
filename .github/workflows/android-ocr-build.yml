name: Android OCR build

on:
  push:
    branches:
      - rebuild-venera-ocr-integrated
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-ocr:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout with Venera-SSR source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Install Flutter without third-party action
        run: |
          git clone --depth 1 --branch 3.41.4 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version

      - name: Configure Java 17
        run: |
          JAVA_BIN="$(readlink -f "$(command -v java)")"
          JAVA_HOME_DIR="$(dirname "$(dirname "$JAVA_BIN")")"
          echo "JAVA_HOME=$JAVA_HOME_DIR" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_DIR/bin" >> "$GITHUB_PATH"
          java -version

      - name: Prepare Rust toolchain
        run: |
          python3 .github/scripts/prepare_rust_toolchain.py \
            --target aarch64-linux-android \
            --target armv7-linux-androideabi \
            --target x86_64-linux-android

      - name: Flutter dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build debug APK
        run: flutter build apk --debug --no-pub

      - name: Upload universal APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: VeneraNext-OCR-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
