name: Android OCR build

on:
  push:
    branches:
      - rebuild-venera-ocr-integrated
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-ocr:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout with Venera-SSR source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          architecture: x64

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Rust toolchain
        run: |
          python3 .github/scripts/prepare_rust_toolchain.py \
            --target aarch64-linux-android \
            --target armv7-linux-androideabi \
            --target x86_64-linux-android

      - name: Flutter dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build debug APK
        env:
          GRADLE_OPTS: >-
            -Dorg.gradle.jvmargs=-Xms512m -Xmx6g -XX:MaxMetaspaceSize=1g
            -Dfile.encoding=UTF-8
        run: flutter build apk --debug --no-pub

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: VeneraNext-OCR-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
